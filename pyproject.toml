[project]
name = "v2tts"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "coqui-tts[cpu]>=0.27,<0.28",
  "faster-whisper",
  "numpy",
  "onnx-asr[cpu,hub]>=0.12,<0.13",
  "sherpa-onnx==1.13.5",
  "sounddevice",
  "soundfile",
]

[project.optional-dependencies]
build = [
  "pyinstaller",
]
