name: Windows frozen smoke

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  frozen-smoke:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: mingw-w64-x86_64-gcc

      - name: Add MinGW to PATH
        shell: pwsh
        run: echo "C:\msys64\mingw64\bin" >> $env:GITHUB_PATH

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt pyinstaller pytest

      - name: Run unit tests
        run: python -m pytest -q

      - name: Build frozen executable
        run: python installer/build.py --skip-install

      - name: Smoke test packaged TTS engines
        run: .\dist\V2TTS.exe --smoke-test
